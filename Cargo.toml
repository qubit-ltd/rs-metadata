[package]
name = "qubit-metadata"
version = "0.9.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-metadata"
description = "Type-safe metadata model with schemas and composable filters"
homepage = "https://github.com/qubit-ltd/rs-metadata"
documentation = "https://docs.rs/qubit-metadata"
readme = "README.md"
keywords = ["metadata", "schema", "qubit", "serde", "filter"]
categories = ["data-structures", "encoding"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/RUST_CODING_STYLE.md",
    "/RUST_CODING_STYLE.zh_CN.md",
    "/doc/**/user_guide*.md",
    "/examples/**",
    "/resources/**",
    "/src/**",
    "/tests/**",
]

[lib]
name = "qubit_metadata"

[package.metadata.docs.rs]
all-features = true

[features]
default = []
chrono = ["dep:chrono", "qubit-value/chrono"]
big-integer = ["dep:num-bigint", "qubit-value/big-integer"]
big-decimal = [
    "dep:bigdecimal",
    "dep:num-bigint",
    "qubit-value/big-decimal",
]
big-number = ["big-integer", "big-decimal"]
url = ["dep:url", "qubit-value/url"]
json = ["dep:serde_json", "qubit-value/json"]
all = ["chrono", "big-number", "url", "json"]

[dependencies]
bigdecimal = { version = "0.4", optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
num-bigint = { version = "0.4", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
qubit-datatype = { path = "../rs-datatype", version = "0.8", default-features = false, features = ["converter"] }
qubit-redact = { path = "../rs-redact", version = "0.3", default-features = false }
qubit-value = { path = "../rs-value", version = "0.10", default-features = false, features = ["converter"] }
url = { version = "2.5", optional = true }

[dev-dependencies]
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
