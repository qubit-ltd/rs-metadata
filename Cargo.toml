[package]
name = "qubit-metadata"
version = "0.10.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-metadata"
description = "Type-safe metadata model with schemas and composable filters"
homepage = "https://github.com/qubit-ltd/rs-metadata"
documentation = "https://docs.rs/qubit-metadata"
readme = "README.md"
keywords = ["metadata", "schema", "qubit", "serde", "filter"]
categories = ["data-structures", "encoding"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/doc/**/user_guide*.md",
    "/examples/**",
    "/resources/**",
    "/src/**",
    "/tests/**",
    "/benches/**",
]

[lib]
name = "qubit_metadata"

[package.metadata.docs.rs]
all-features = true

[features]
default = []
filter = []
schema = ["filter"]
chrono = ["qubit-value/chrono"]
big-integer = ["qubit-value/big-integer"]
big-decimal = ["qubit-value/big-decimal"]
big-number = ["big-integer", "big-decimal"]
url = ["qubit-value/url"]
json = ["dep:serde_json", "qubit-value/json"]
all = ["schema", "chrono", "big-number", "url", "json"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
qubit-datatype = { version = "0.10", default-features = false, features = ["converter"] }
qubit-budget = { version = "0.3", path = "../rs-budget" }
qubit-redact = { version = "0.4", default-features = false }
qubit-utils = { version = "0.2" }
qubit-value = { version = "0.10", path = "../rs-value", default-features = false, features = ["converter", "redact"] }

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
serde_json = "1.0"

[[bench]]
name = "metadata_benchmarks"
harness = false
required-features = ["filter"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
