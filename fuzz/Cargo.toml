[package]
name = "qubit-metadata-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
qubit-metadata = { path = "..", features = ["all"] }
serde_json = "1.0"

[[bin]]
name = "decode_metadata"
path = "fuzz_targets/decode_metadata.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_metadata_schema"
path = "fuzz_targets/decode_metadata_schema.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_metadata_filter"
path = "fuzz_targets/decode_metadata_filter.rs"
test = false
doc = false
bench = false
